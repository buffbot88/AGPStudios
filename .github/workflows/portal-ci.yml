name: Portal CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portal:
    name: Build portal and check API contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install portal dependencies
        working-directory: apps/ashat-hub-web
        run: npm install --no-audit --no-fund

      - name: Build portal
        working-directory: apps/ashat-hub-web
        run: npm run build

      - name: Check frontend endpoint documentation
        working-directory: apps/ashat-hub-web
        run: npm run test:endpoint-docs

      - name: Start mock API
        run: |
          PORT=3110 python3 scripts/mock-api.py --no-verification > "$RUNNER_TEMP/mock-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mock-api.pid"
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3110/__config > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'Mock API did not become ready.' >&2
            cat "$RUNNER_TEMP/mock-api.log" >&2
            exit 1
          fi

      - name: Run frontend contract checks
        working-directory: apps/ashat-hub-web
        env:
          ASHAT_TEST_BASE: http://127.0.0.1:3110
        run: npm run test:contracts

      - name: Run API contract smoke suite against the mock
        env:
          ASHAT_TEST_BASE: http://127.0.0.1:3110
          ASHAT_TEST_MUTATIONS: '1'
        run: python3 services/python-api/test_contracts.py

      - name: Show mock API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/mock-api.log" || true

      - name: Stop mock API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mock-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/mock-api.pid")" 2>/dev/null || true
          fi
