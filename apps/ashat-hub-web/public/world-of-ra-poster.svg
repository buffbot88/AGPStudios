<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The World of Ra poster art">
  <defs>
    <!-- night desert sky -->
    <linearGradient id="ra-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1830"/>
      <stop offset=".55" stop-color="#122742"/>
      <stop offset="1" stop-color="#1d3a52"/>
    </linearGradient>
    <!-- dune haze near the horizon -->
    <linearGradient id="ra-dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24405a"/>
      <stop offset="1" stop-color="#0c1c2e"/>
    </linearGradient>
    <!-- sun disc: the god Ra's symbol -->
    <radialGradient id="ra-sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6d16b"/>
      <stop offset=".7" stop-color="#e7b64a"/>
      <stop offset="1" stop-color="#d99f35"/>
    </radialGradient>
    <radialGradient id="ra-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f1c25b" stop-opacity=".4"/>
      <stop offset="1" stop-color="#f1c25b" stop-opacity="0"/>
    </radialGradient>
    <!-- sacred scarab / ankh gold -->
    <linearGradient id="ra-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d16b"/>
      <stop offset="1" stop-color="#d99f35"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#ra-sky)"/>

  <!-- stars -->
  <g fill="#cfe2ee">
    <circle cx="52" cy="48" r="1.2" opacity=".7"/>
    <circle cx="120" cy="30" r="1" opacity=".5"/>
    <circle cx="318" cy="42" r="1.4" opacity=".8"/>
    <circle cx="352" cy="92" r="1" opacity=".5"/>
    <circle cx="86" cy="104" r="1" opacity=".4"/>
    <circle cx="288" cy="120" r="1" opacity=".6"/>
    <circle cx="36" cy="150" r="1" opacity=".4"/>
    <circle cx="228" cy="60" r="1" opacity=".5"/>
  </g>

  <!-- setting sun with halo -->
  <circle cx="268" cy="112" r="110" fill="url(#ra-glow)"/>
  <circle cx="268" cy="112" r="34" fill="url(#ra-sun)"/>

  <!-- pyramids on the horizon -->
  <g>
    <path d="M28 246 L118 150 L208 246 Z" fill="#0b1e33"/>
    <path d="M118 150 L208 246 L172 246 L118 178 Z" fill="#12283f"/>
    <path d="M178 252 L252 182 L326 252 Z" fill="#0e2338"/>
    <path d="M252 182 L326 252 L296 252 L252 204 Z" fill="#14293e"/>
  </g>

  <!-- dunes -->
  <path d="M0 262 Q100 240 200 258 T400 252 L400 300 L0 300 Z" fill="url(#ra-dune)"/>
  <path d="M0 282 Q130 264 260 278 T400 272 L400 300 L0 300 Z" fill="#081524"/>

  <!-- rising ankh, gold on the dune line -->
  <g transform="translate(96 196)">
    <circle cx="20" cy="6" r="9" fill="none" stroke="url(#ra-gold)" stroke-width="4"/>
    <line x1="20" y1="15" x2="20" y2="58" stroke="url(#ra-gold)" stroke-width="5" stroke-linecap="round"/>
    <line x1="4" y1="28" x2="36" y2="28" stroke="url(#ra-gold)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- thin horizon line for structure -->
  <line x1="0" y1="262" x2="400" y2="262" stroke="#f1c25b" stroke-opacity=".18" stroke-width="1"/>

  <text x="30" y="256" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#f6d16b">The World of Ra</text>
  <text x="31" y="272" font-family="Verdana, Geneva, sans-serif" font-size="8" letter-spacing="2" fill="#c9b28a">HORIZON · SEASON 1</text>
</svg>
