[package]
name = "omega-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Omega inference engine: spawn-on-demand llama-server pools, wait queues, the 230M intent orchestrator, proxying, and baseline supervision."

[features]
default = []

[dependencies]
omega-common = { path = "../omega-common" }
bytes = "1"
chrono = { workspace = true }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
