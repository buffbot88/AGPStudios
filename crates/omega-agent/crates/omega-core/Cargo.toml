[package]
name = "omega-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Omega inference engine: spawn-on-demand llama-server pools, wait queues, the 230M intent orchestrator, proxying, and baseline supervision."

[features]
default = []
# Compiles the MySQL skills-database client (SkillDb). Off by default: the
# skill tool is config-gated (`skills_db.enabled`) and this stack (mysql →
# mysql_common → flate2/openssl) is only needed once the DB connection details
# are provided. Enable with `--features omega-core/skills-db`.
skills-db = ["dep:mysql"]

[dependencies]
omega-common = { path = "../omega-common" }
bytes = "1"
chrono = { workspace = true }
futures = "0.3"
mysql = { version = "25", default-features = false, features = ["rustls-tls"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
