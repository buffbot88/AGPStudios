[package]
name = "ashat-neural-host-master"
version = "0.1.0"
edition = "2021"
description = "Omega: orchestrator + spawn-on-demand 1.2B coding-agent pool for the Ashat Neural Host Master Edition"
license = "MIT"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
