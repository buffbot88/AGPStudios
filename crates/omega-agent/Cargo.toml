[package]
name = "omega-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "omega-agent"
path = "src/main.rs"

[dependencies]
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
