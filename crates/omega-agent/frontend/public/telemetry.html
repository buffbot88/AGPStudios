<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Telemetry · v6.2 · Ashat Neural Host</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --ink: #05070a;
            --bg-soft: #0a0d12;
            --panel: #0b0f15;
            --panel-raised: #11161f;
            --line: #1c2431;
            --line-soft: #141a24;
            --text: #e8edf4;
            --text-soft: #a3aebd;
            --muted: #6b7684;
            --dim: #3d4754;
            --accent: #ff7a45;
            --accent-hover: #ff9468;
            --cyan: #39c2d6;
            --green: #3ddc97;
            --amber: #f2b23e;
            --red: #ff5d5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--ink);
            background-image:
                linear-gradient(rgba(28, 36, 49, 0.14) 1px, transparent 1px),
                linear-gradient(90deg, rgba(28, 36, 49, 0.14) 1px, transparent 1px);
            background-size: 56px 56px;
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--line);
            padding-bottom: 1.5rem;
        }

        .brand h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand h1 span {
            color: var(--accent);
        }

        .brand .subtitle {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            margin-top: 0.35rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 1.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-soft);
            padding-top: 0.35rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px rgba(61, 220, 151, 0.7);
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: var(--dim);
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .server-card {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 1.25rem 1.25rem 1.1rem;
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .server-card::before,
        .server-card::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1.5px solid var(--accent);
            pointer-events: none;
        }

        .server-card::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .server-card::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        .server-card:hover {
            border-color: rgba(57, 194, 214, 0.5);
            transform: translateY(-2px);
        }

        .server-card.offline {
            opacity: 0.55;
        }

        .server-card.offline::before,
        .server-card.offline::after {
            border-color: var(--dim);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .server-name {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }

        .server-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }

        .server-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .badge-online {
            background: rgba(61, 220, 151, 0.12);
            color: var(--green);
            border: 1px solid rgba(61, 220, 151, 0.35);
        }

        .badge-offline {
            background: rgba(61, 107, 132, 0.12);
            color: var(--muted);
            border: 1px solid rgba(61, 107, 132, 0.35);
        }

        .model-line {
            font-size: 0.72rem;
            color: var(--text-soft);
            font-family: 'JetBrains Mono', monospace;
            border-bottom: 1px solid var(--line-soft);
            padding-bottom: 0.9rem;
            margin-bottom: 1rem;
            letter-spacing: 0.3px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.9rem;
        }

        .metric {
            padding: 0.7rem 0.8rem;
            border-radius: 6px;
            background: var(--bg-soft);
            border: 1px solid var(--line-soft);
        }

        .metric-label {
            font-size: 0.65rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 0.4rem;
        }

        .metric-value {
            font-size: 1.35rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text);
        }

        .metric-value.tokens-in,
        .metric-value.tokens-out {
            color: var(--cyan);
        }

        .metric-value.requests {
            color: var(--accent);
        }

        .metric-value.latency {
            color: var(--text-soft);
        }

        .metric-unit {
            font-size: 0.75rem;
            color: var(--muted);
            margin-left: 0.2rem;
        }

        .summary-section {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 1.5rem;
            position: relative;
        }

        .summary-section::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 10px;
            height: 10px;
            border: 1.5px solid var(--cyan);
            border-right: none;
            border-bottom: none;
        }

        .summary-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-soft);
            font-family: 'JetBrains Mono', monospace;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 0.9rem;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.75rem 0.9rem;
            background: var(--bg-soft);
            border: 1px solid var(--line-soft);
            border-radius: 6px;
        }

        .summary-label {
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }

        .summary-value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text);
            font-size: 0.95rem;
        }

        .summary-value.tokens-in,
        .summary-value.tokens-out {
            color: var(--cyan);
        }

        .summary-value.requests {
            color: var(--accent);
        }

        footer {
            text-align: center;
            margin-top: 2.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--line);
            color: var(--dim);
            font-size: 0.75rem;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .error {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 93, 93, 0.08);
            border: 1px solid rgba(255, 93, 93, 0.3);
            border-radius: 8px;
            color: var(--red);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <h1>OMEGA <span>·</span> NEURAL HOST</h1>
                <p class="subtitle">V6.2 · Master Edition · Public Telemetry</p>
            </div>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
                <div class="status-item">
                    <span>Last update <span id="lastUpdate">--:--:--</span></span>
                </div>
            </div>
        </header>

        <div id="content">
            <div class="loading">Acquiring telemetry feed...</div>
        </div>

        <footer>
            <p>OMEGA V6.2 · ASHAT NEURAL HOST MASTER EDITION · LOCAL FIRST · PRIVATE BY DEFAULT</p>
            <p>Feed refreshes every 5 seconds</p>
        </footer>
    </div>

    <script>
        const API_BASE = '';
        const REFRESH_INTERVAL = 5000;

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${minutes}m`;
        }

        function getTime() {
            return new Date().toLocaleTimeString('en-US', { hour12: false });
        }

        function friendlyModel(raw) {
            // Never expose a filesystem path: keep only the basename and strip
            // the model-file extension.
            return (raw || '').split('/').pop().replace(/\.(gguf|bin)$/i, '') || '—';
        }

        function activeLanes(lanes) {
            return ['omega', 'beta', 'delta'].filter((key) => lanes?.[key]?.lane_state === 'online');
        }

        function createServerCard(name, data) {
            const state = data?.lane_state || 'offline';
            const isOffline = state !== 'online';
            const badgeClass = isOffline ? 'badge-offline' : 'badge-online';
            const cardClass = isOffline ? 'offline' : '';
            const model = friendlyModel(data?.model);

            return `
                <div class="server-card ${cardClass}">
                    <div class="server-header">
                        <h2 class="server-name">${name}</h2>
                        <span class="server-badge ${badgeClass}">${isOffline ? 'Offline' : state}</span>
                    </div>
                    <div class="model-line">${model}</div>
                    <div class="metrics-grid">
                        <div class="metric">
                            <div class="metric-label">Tokens In</div>
                            <div class="metric-value tokens-in">${formatNumber(data?.total_prompt_tokens || 0)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Tokens Out</div>
                            <div class="metric-value tokens-out">${formatNumber(data?.total_completion_tokens || 0)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Requests</div>
                            <div class="metric-value requests">${formatNumber(data?.total_requests || 0)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Avg Latency</div>
                            <div class="metric-value latency">${(data?.avg_total_latency_ms || 0).toFixed(0)}<span class="metric-unit">ms</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function createSummarySection(lanes, uptimeSeconds) {
            const lanesObj = lanes || {};
            const totalTokensIn = ['omega', 'beta', 'delta'].reduce((sum, key) => sum + (lanesObj[key]?.total_prompt_tokens || 0), 0);
            const totalTokensOut = ['omega', 'beta', 'delta'].reduce((sum, key) => sum + (lanesObj[key]?.total_completion_tokens || 0), 0);
            const totalRequests = ['omega', 'beta', 'delta'].reduce((sum, key) => sum + (lanesObj[key]?.total_requests || 0), 0);
            const onlineLanes = activeLanes(lanesObj).length;

            return `
                <div class="summary-section">
                    <h3 class="summary-title">Fleet Totals</h3>
                    <div class="summary-grid">
                        <div class="summary-item">
                            <span class="summary-label">Tokens In</span>
                            <span class="summary-value tokens-in">${formatNumber(totalTokensIn)}</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Tokens Out</span>
                            <span class="summary-value tokens-out">${formatNumber(totalTokensOut)}</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Requests</span>
                            <span class="summary-value requests">${formatNumber(totalRequests)}</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Lanes In Use</span>
                            <span class="summary-value">${onlineLanes}/3</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Active Model</span>
                            <span class="summary-value" id="activeModelTicker">—</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Uptime</span>
                            <span class="summary-value">${formatUptime(uptimeSeconds || 0)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Cycle the "Active Model" ticker through the online lanes' models.
        let modelTick = 0;
        let lastLanes = null;
        function startModelTicker(lanes) {
            lastLanes = lanes;
        }
        setInterval(() => {
            const el = document.getElementById('activeModelTicker');
            const lanes = lastLanes || {};
            const active = activeLanes(lanes);
            if (!el) return;
            if (active.length === 0) {
                el.textContent = '—';
                return;
            }
            const key = active[modelTick % active.length];
            modelTick += 1;
            const lane = lanes[key];
            el.textContent = `${friendlyModel(lane.model)} · ${key}`;
        }, 2500);

        async function fetchData() {
            try {
                const response = await fetch(`${API_BASE}/api/public_status`);
                if (!response.ok) throw new Error('Failed to fetch');
                return await response.json();
            } catch (error) {
                console.error('Error fetching data:', error);
                return null;
            }
        }

        async function updateDashboard() {
            const data = await fetchData();
            const contentEl = document.getElementById('content');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const lastUpdate = document.getElementById('lastUpdate');

            if (!data) {
                statusDot.classList.add('offline');
                statusText.textContent = 'Connection Error';
                contentEl.innerHTML = `
                    <div class="error">
                        <p>Unable to fetch telemetry data</p>
                        <p>Confirm the Omega service is running on port 8080</p>
                    </div>
                `;
                return;
            }

            statusDot.classList.remove('offline');
            statusText.textContent = 'Live';
            lastUpdate.textContent = getTime();

            const omegaData = data.lanes?.omega || {};
            const betaData = data.lanes?.beta || {};
            const deltaData = data.lanes?.delta || {};

            contentEl.innerHTML = `
                <div class="servers-grid">
                    ${createServerCard('Omega', omegaData)}
                    ${createServerCard('Beta', betaData)}
                    ${createServerCard('Delta', deltaData)}
                </div>
                ${createSummarySection(data.lanes || {}, data.uptime_seconds)}
            `;
            startModelTicker(data.lanes || {});
            const ticker = document.getElementById('activeModelTicker');
            const lanes = data.lanes || {};
            const active = activeLanes(lanes);
            if (ticker && active.length > 0) {
                const key = active[0];
                ticker.textContent = `${friendlyModel(lanes[key].model)} · ${key}`;
            }
        }

        // Initial load
        updateDashboard();

        // Auto-refresh
        setInterval(updateDashboard, REFRESH_INTERVAL);
    </script>
</body>
</html>
