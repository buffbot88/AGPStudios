[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ashatos-neural-host"
version = "1.0.0"
description = "AshatOS BrainStem Inference Host — private inference appliance on HF Spaces"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "spaces.*",
    "huggingface_hub.*",
    "gradio.*",
    "requests.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app.py", "domain.py", "install_strategies.py", "run_errors.py", "run_metrics.py", "metrics_store.py", "response_adapter.py", "llama_stderr_parser.py"]
omit = ["tests/*"]
